name: Release

# Produces a signed AAB for Play and a signed APK for direct install.
#
# Triggered by pushing a version tag (v1.2.3), or manually for a dry run. Tag pushes also
# attach the artifacts to a GitHub release; manual runs only upload build artifacts, so the
# workflow can be exercised without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName to stamp (defaults to the module's own value)"
        required: false
        type: string

# Least privilege by default; the publish job raises it to write only where it must.
permissions:
  contents: read

concurrency:
  # Never let two releases for the same ref sign concurrently. Cancelling in progress is
  # deliberately off: a half-cancelled signing job is worse than a duplicate one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"

jobs:
  # Gate the release on the logic tests. :core is plain Kotlin/JVM, so this needs no
  # Android SDK and finishes in well under a minute — a cheap guard against shipping a
  # build whose measurement maths is broken.
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Configuring :app requires the Android SDK even when only :core is being built,
      # because Gradle evaluates every project in the build before running any task.
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null

      - name: Run core tests
        run: ./gradlew :core:jvmTest --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/jvmTest/
          retention-days: 14

  build:
    name: Signed AAB and APK
    needs: test
    runs-on: ubuntu-latest
    # Write, so the first run can commit the encrypted upload key. Nothing else is pushed.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # refs/tags/v1.2.3 -> 1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version_name }}" ]; then
            VERSION="${{ inputs.version_name }}"
          else
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION:-<module default>}"

      # The upload key, in one of two ways:
      #
      #  - KEYSTORE_BASE64 (+ KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) secrets: a key made
      #    on a computer, as before.
      #  - Only a SIGNING_PASSPHRASE secret: the key is created here on the first run, then
      #    kept in the repository ENCRYPTED with that passphrase (AES-256, PBKDF2 with 600,000
      #    rounds) as signing/upload.jks.enc. Without the passphrase the file is noise. Every
      #    later run decrypts it, so every release is signed by the same key.
      #
      # The decrypted keystore only ever exists in RUNNER_TEMP, never in the workspace, so no
      # later step can archive or upload it.
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          JKS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$JKS"
            if [ ! -s "$JKS" ]; then
              echo "::error::Decoded keystore is empty; the secret is probably not valid base64."
              exit 1
            fi
            exit 0
          fi

          if [ "${#SIGNING_PASSPHRASE}" -lt 20 ]; then
            echo "::error::Add a SIGNING_PASSPHRASE repository secret (at least 20 random characters). See docs/PLAY_RELEASE.md."
            exit 1
          fi

          if [ -f signing/upload.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
              -in signing/upload.jks.enc -out "$JKS" -pass env:SIGNING_PASSPHRASE \
              || { echo "::error::Could not decrypt signing/upload.jks.enc: SIGNING_PASSPHRASE is not the one it was created with."; exit 1; }
          else
            if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
              echo "::error::No upload key yet. Run this workflow once from a branch (Actions › Release › Run workflow) to create it."
              exit 1
            fi
            echo "Creating the upload key (first release)"
            keytool -genkeypair -keystore "$JKS" -storetype PKCS12 -alias upload \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$SIGNING_PASSPHRASE" -keypass "$SIGNING_PASSPHRASE" \
              -dname "CN=Squeeze.fit, O=Squeeze.fit"
            mkdir -p signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
              -in "$JKS" -out signing/upload.jks.enc -pass env:SIGNING_PASSPHRASE
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/upload.jks.enc
            git commit -m "Add the encrypted upload key"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          # The PKCS12 store and its key share one password: the passphrase.
          {
            echo "SQ_KEYSTORE_PASSWORD=$SIGNING_PASSPHRASE"
            echo "SQ_KEY_ALIAS=upload"
            echo "SQ_KEY_PASSWORD=$SIGNING_PASSPHRASE"
          } >> "$GITHUB_ENV"

          # Public fingerprints: the SHA-1 is what the Google Cloud Android client needs.
          echo "Upload key fingerprints:"
          keytool -list -v -keystore "$JKS" -alias upload -storepass "$SIGNING_PASSPHRASE" | grep -E "SHA1|SHA256"

      # The on-device vision-language model: fetched from a pinned URL, checksum-verified
      # and compressed to 48.5 MB. See tools/vlm/prepare_clip.py.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache the on-device CLIP model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/clip_vitb32_laion_q4.onnx
          key: clip-vitb32-laion-q4-81148049

      - name: Prepare the on-device CLIP model
        run: |
          pip install --quiet onnx==1.17.0 onnxruntime==1.20.1
          python tools/vlm/prepare_clip.py

      - name: Build signed AAB and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_PUBLIC_KEY: ${{ secrets.PLAY_PUBLIC_KEY }}
          # github.run_number is monotonic per workflow, which is what Play requires of
          # versionCode. Re-running a tag therefore produces a higher code, not a clash.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          # Secrets win when set; otherwise the passphrase-made key from the step above.
          export KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD:-${SQ_KEYSTORE_PASSWORD:-}}"
          export KEY_ALIAS="${KEY_ALIAS:-${SQ_KEY_ALIAS:-}}"
          export KEY_PASSWORD="${KEY_PASSWORD:-${SQ_KEY_PASSWORD:-}}"
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      # Signing is the whole point of this workflow, so verify it rather than assuming it.
      # A missing signingConfig yields an unsigned artifact and no build error, which would
      # otherwise only surface when Play rejects the upload.
      - name: Verify signatures
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)

          if [ -z "$APK" ] || [ -z "$AAB" ]; then
            echo "::error::Expected both an APK and an AAB; found APK='$APK' AAB='$AAB'"
            exit 1
          fi

          echo "Verifying APK signature"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

          # apksigner does not read AABs; jarsigner confirms the bundle carries a signature.
          echo "Verifying AAB signature"
          jarsigner -verify "$AAB" > /dev/null && echo "AAB signature OK"

      # Files are renamed to carry the version; the artifact name itself stays constant so
      # the publish job can reference it without reconstructing a conditional expression.
      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SUFFIX="${VERSION:+-$VERSION}"
          mkdir -p dist

          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" "dist/squeeze${SUFFIX}.apk"
          cp "$(find app/build/outputs/bundle/release -name '*.aab' | head -1)" "dist/squeeze${SUFFIX}.aab"

          # Needed to deobfuscate R8-minified stack traces. Retained as a build artifact,
          # but never attached to a public release; see the publish job.
          MAPPING=$(find app/build/outputs/mapping/release -name 'mapping.txt' | head -1 || true)
          if [ -n "$MAPPING" ]; then cp "$MAPPING" "dist/mapping${SUFFIX}.txt"; fi

          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squeeze-release
          path: dist/
          retention-days: 90
          if-no-files-found: error

      # Runs even if an earlier step failed. Leaving a decoded signing key on a runner is
      # the kind of mistake that only matters once.
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  publish:
    name: Attach to GitHub release
    needs: build
    # Tag pushes only: a manual run is a dry run and must not publish anything.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: squeeze-release
          path: dist

      # The GitHub CLI is preinstalled on the runner, so this avoids taking a third-party
      # action into the release path — the one place where a supply-chain compromise would
      # reach signed binaries.
      #
      # mapping.txt is excluded deliberately: it is needed to deobfuscate crash reports and
      # should go to Play Console, not to a public release page where it hands anyone a map
      # of the obfuscated build.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "Squeeze ${{ needs.build.outputs.version }}" \
            --generate-notes \
            --draft \
            dist/*.apk dist/*.aab
