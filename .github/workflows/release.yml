name: Release

# Produces a signed AAB for Play and a signed APK for direct install.
#
# Triggered by pushing a version tag (v1.2.3), or manually for a dry run. Tag pushes also
# attach the artifacts to a GitHub release; manual runs only upload build artifacts, so the
# workflow can be exercised without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName to stamp (defaults to the module's own value)"
        required: false
        type: string

# Least privilege by default; the publish job raises it to write only where it must.
permissions:
  contents: read

concurrency:
  # Never let two releases for the same ref sign concurrently. Cancelling in progress is
  # deliberately off: a half-cancelled signing job is worse than a duplicate one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"

jobs:
  # Gate the release on the logic tests. :core is plain Kotlin/JVM, so this needs no
  # Android SDK and finishes in well under a minute — a cheap guard against shipping a
  # build whose measurement maths is broken.
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Configuring :app requires the Android SDK even when only :core is being built,
      # because Gradle evaluates every project in the build before running any task.
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" > /dev/null

      - name: Run core tests
        run: ./gradlew :core:test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test/
          retention-days: 14

  build:
    name: Signed AAB and APK
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # refs/tags/v1.2.3 -> 1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version_name }}" ]; then
            VERSION="${{ inputs.version_name }}"
          else
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION:-<module default>}"

      # The keystore is written to RUNNER_TEMP rather than the workspace so it can never be
      # picked up by a later step that archives or uploads the checkout.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the repository secrets described in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # Confirm it decoded to something a keystore-shaped, without printing its contents.
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Decoded keystore is empty; the secret is probably not valid base64."
            exit 1
          fi

      - name: Build signed AAB and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_PUBLIC_KEY: ${{ secrets.PLAY_PUBLIC_KEY }}
          # github.run_number is monotonic per workflow, which is what Play requires of
          # versionCode. Re-running a tag therefore produces a higher code, not a clash.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      # Signing is the whole point of this workflow, so verify it rather than assuming it.
      # A missing signingConfig yields an unsigned artifact and no build error, which would
      # otherwise only surface when Play rejects the upload.
      - name: Verify signatures
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)

          if [ -z "$APK" ] || [ -z "$AAB" ]; then
            echo "::error::Expected both an APK and an AAB; found APK='$APK' AAB='$AAB'"
            exit 1
          fi

          echo "Verifying APK signature"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

          # apksigner does not read AABs; jarsigner confirms the bundle carries a signature.
          echo "Verifying AAB signature"
          jarsigner -verify "$AAB" > /dev/null && echo "AAB signature OK"

      # Files are renamed to carry the version; the artifact name itself stays constant so
      # the publish job can reference it without reconstructing a conditional expression.
      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SUFFIX="${VERSION:+-$VERSION}"
          mkdir -p dist

          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" "dist/squeeze${SUFFIX}.apk"
          cp "$(find app/build/outputs/bundle/release -name '*.aab' | head -1)" "dist/squeeze${SUFFIX}.aab"

          # Needed to deobfuscate R8-minified stack traces. Retained as a build artifact,
          # but never attached to a public release; see the publish job.
          MAPPING=$(find app/build/outputs/mapping/release -name 'mapping.txt' | head -1 || true)
          if [ -n "$MAPPING" ]; then cp "$MAPPING" "dist/mapping${SUFFIX}.txt"; fi

          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squeeze-release
          path: dist/
          retention-days: 90
          if-no-files-found: error

      # Runs even if an earlier step failed. Leaving a decoded signing key on a runner is
      # the kind of mistake that only matters once.
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  publish:
    name: Attach to GitHub release
    needs: build
    # Tag pushes only: a manual run is a dry run and must not publish anything.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: squeeze-release
          path: dist

      # The GitHub CLI is preinstalled on the runner, so this avoids taking a third-party
      # action into the release path — the one place where a supply-chain compromise would
      # reach signed binaries.
      #
      # mapping.txt is excluded deliberately: it is needed to deobfuscate crash reports and
      # should go to Play Console, not to a public release page where it hands anyone a map
      # of the obfuscated build.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "Squeeze ${{ needs.build.outputs.version }}" \
            --generate-notes \
            --draft \
            dist/*.apk dist/*.aab
